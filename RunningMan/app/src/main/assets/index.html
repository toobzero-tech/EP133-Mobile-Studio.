<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Бегущий человек</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#25231f;font-family:Georgia,serif;touch-action:none}canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse,#fff 65%,#f1eee7)}#hud{position:absolute;inset:0;pointer-events:none}#speedbox{position:absolute;right:8px;top:20%;height:48%;width:44px;pointer-events:auto}#speed{height:100%;width:30px;writing-mode:vertical-lr;direction:rtl;accent-color:#383631}#speedlabel{position:absolute;right:0;top:-23px;font-size:12px}button{font-family:Georgia;border:1.5px solid #3d3b36;background:#fffE;box-shadow:2px 3px 0 #aaa;color:#25231f}#pause{position:absolute;top:12px;left:12px;padding:8px 12px;pointer-events:auto}#meters{position:absolute;top:52px;left:12px;font-size:13px}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:repeating-linear-gradient(8deg,#f5f2e9 0 20px,#eeeae0 21px,#f5f2e9 22px 43px)}h1{font-size:clamp(32px,9vw,50px);letter-spacing:2px;text-shadow:1px 1px #aaa}.sub{font-style:italic;margin:-8px 0 30px}.switch{width:210px;padding:16px;margin:9px;font-size:18px;font-weight:bold}#paused{display:none;position:absolute;inset:0;background:#ffffffc9;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
</style></head><body><canvas id="c"></canvas><div id="hud"><button id="pause">Ⅱ ПАУЗА</button><div id="meters">0 м</div><div id="speedbox"><span id="speedlabel">5/10</span><input id="speed" type="range" min="1" max="10" value="5"></div></div><div id="paused">ПАУЗА</div><div id="menu"><h1>БЕГУЩИЙ<br>ЧЕЛОВЕК</h1><div class="sub">Карандашный бесконечный бег</div><button class="switch" id="start">◉ ПОЕХАЛИ</button><button class="switch" id="exit">⏻ ВЫХОД</button><small>Тап по экрану — прыжок · ползунок справа — скорость</small></div><script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),menu=document.getElementById('menu'),pauseLayer=document.getElementById('paused');let w,h,run=false,paused=false,spd=5,time=0,meters=0,jump=0,obs=[],last=0;function size(){w=c.width=innerWidth;h=c.height=innerHeight}onresize=size;size();function ln(a,b,d,e,width=2,alpha=.65){x.strokeStyle=`rgba(35,34,31,${alpha})`;x.lineWidth=width;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}function person(px,py){const sw=Math.sin(time*spd*.24),lift=jump?Math.sin(jump*Math.PI)*h*.17:0;x.save();x.translate(px,py-lift);x.strokeStyle='#292722';x.fillStyle='rgba(42,40,35,.10)';x.lineCap='round';x.lineJoin='round';
function limb(ax,ay,bx,by,r1,r2){const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;x.beginPath();x.moveTo(ax+nx*r1,ay+ny*r1);x.quadraticCurveTo((ax+bx)/2+nx*(r1+r2)*.6,(ay+by)/2+ny*(r1+r2)*.6,bx+nx*r2,by+ny*r2);x.lineTo(bx-nx*r2,by-ny*r2);x.quadraticCurveTo((ax+bx)/2-nx*(r1+r2)*.6,(ay+by)/2-ny*(r1+r2)*.6,ax-nx*r1,ay-ny*r1);x.closePath();x.fill();x.lineWidth=1.8;x.stroke();for(let k=1;k<4;k++){const t=k/4;ln(ax+(bx-ax)*t-3,ay+(by-ay)*t+2,ax+(bx-ax)*t+3,ay+(by-ay)*t-2,.7,.28)}}
x.beginPath();x.ellipse(0,-76,10,13,-.04,0,Math.PI*2);x.fill();x.lineWidth=2;x.stroke();
x.beginPath();x.moveTo(-8,-62);x.quadraticCurveTo(-18,-59,-19,-48);x.lineTo(-13,-27);x.quadraticCurveTo(0,-22,13,-27);x.lineTo(19,-48);x.quadraticCurveTo(18,-59,8,-62);x.quadraticCurveTo(0,-58,-8,-62);x.closePath();x.fill();x.lineWidth=2.3;x.stroke();
x.beginPath();x.moveTo(-13,-29);x.quadraticCurveTo(0,-23,13,-29);x.lineTo(11,-18);x.quadraticCurveTo(0,-13,-11,-18);x.closePath();x.fill();x.stroke();
limb(-15,-56,-21-sw*7,-38,5,3.5);limb(-21-sw*7,-38,-25-sw*9,-20,3.5,2.4);
limb(15,-56,21+sw*7,-40,5,3.5);limb(21+sw*7,-40,25+sw*9,-23,3.5,2.4);
limb(-8,-19,-15+sw*12,2,7,5);limb(-15+sw*12,2,-20+sw*15,19,5,2.8);limb(-20+sw*15,19,-27+sw*15,20,3,2);
limb(8,-19,15-sw*12,1,7,5);limb(15-sw*12,1,20-sw*15,18,5,2.8);limb(20-sw*15,18,27-sw*15,19,3,2);
for(let i=0;i<9;i++){let yy=-57+i*4;ln(-8+(i%2),yy,8-(i%3),yy+2,.65,.18)}
x.restore()}function obstacle(o){let s=.25+o.z*1.4,y=h*.7-o.z*h*.43,px=w/2+o.x*s;x.save();x.translate(px,y);x.scale(s,s);if(o.type===0){ln(-55,0,52,-5,12,.85);for(let i=0;i<7;i++)ln(-35+i*11,-4,-38+i*11,-17,2,.5)}else if(o.type===1){x.beginPath();x.moveTo(-35,0);x.lineTo(-19,-48);x.lineTo(17,-48);x.lineTo(38,0);x.closePath();x.strokeStyle='#333';x.lineWidth=3;x.stroke()}else{x.beginPath();x.ellipse(0,-8,33,14,0,0,7);x.strokeStyle='#333';x.lineWidth=3;x.stroke()}x.restore()}function draw(){x.clearRect(0,0,w,h);let hy=h*.27;ln(w/2,hy,w*.04,h,1,.16);ln(w/2,hy,w*.96,h,1,.16);for(let i=0;i<7;i++){let yy=hy+(i*95+time*spd*2)%(h-hy);ln(w/2-(yy-hy)*.45,yy,w/2+(yy-hy)*.45,yy,1,.12)}obs.forEach(obstacle);person(w/2,h*.78)}function loop(ts){if(!last)last=ts;let dt=Math.min((ts-last)/16.67,2);last=ts;if(run&&!paused){time+=dt;meters+=spd*.012*dt;if(Math.random()<.012*dt)obs.push({z:0,x:(Math.random()-.5)*.55,type:Math.floor(Math.random()*3)});obs.forEach(o=>{o.z+=spd*.0018*dt;if(!o.checked&&o.z>=.84){o.checked=true;if(Math.abs(o.x)<.17&&jump<.42){run=false;paused=true;pauseLayer.innerHTML='СТОЛКНОВЕНИЕ<br><button id=\"retry\" style=\"font-size:18px;padding:12px 24px;margin-top:22px\">ЗАНОВО</button>';pauseLayer.style.display='flex';document.getElementById('retry').onclick=()=>{run=true;paused=false;meters=0;time=0;jump=0;obs=[];pauseLayer.style.display='none';document.getElementById('pause').textContent='Ⅱ ПАУЗА'}}}});obs=obs.filter(o=>o.z<1.1);if(jump>0)jump=Math.max(0,jump-.035*dt);document.getElementById('meters').textContent=Math.floor(meters)+' м'}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);document.getElementById('speed').oninput=e=>{spd=+e.target.value;document.getElementById('speedlabel').textContent=spd+'/10'};c.addEventListener('pointerdown',e=>{if(run&&!paused&&jump===0){jump=1}});document.getElementById('pause').onclick=()=>{if(!run)return;paused=!paused;pauseLayer.style.display=paused?'flex':'none';document.getElementById('pause').textContent=paused?'▶ ПРОДОЛЖИТЬ':'Ⅱ ПАУЗА'};document.getElementById('start').onclick=()=>{run=true;paused=false;meters=0;time=0;jump=0;obs=[];menu.style.display='none';pauseLayer.style.display='none'};document.getElementById('exit').onclick=()=>{run=false;menu.style.display='flex';pauseLayer.style.display='none'};})();</script></body></html>

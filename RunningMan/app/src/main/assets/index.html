<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Бегущий человек</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4d8;font-family:Arial,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;color:#292622}#score{position:absolute;left:3%;top:3%;font-weight:bold;font-size:clamp(14px,3vw,25px)}
#pause{position:absolute;right:3%;top:3%;width:10%;height:10%;pointer-events:auto;font-size:clamp(18px,3vw,28px);border:2px solid #39342f;border-radius:10px;background:#d6cfc0}
#speedWrap{position:absolute;right:3.5%;top:19%;height:43%;width:9%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(10px,1.7vw,15px);font-weight:bold}
#speed{height:85%;width:28%;writing-mode:vertical-lr;direction:rtl;accent-color:#d18b36;pointer-events:auto}
#jump{position:absolute;right:13%;bottom:5%;width:22%;height:16%;pointer-events:auto;border:3px solid #39342f;border-radius:14px;background:#d69a45;color:#292622;font-weight:bold;font-size:clamp(16px,3vw,25px)}
#message{position:absolute;left:20%;top:34%;width:58%;text-align:center;font-size:clamp(18px,4vw,34px);font-weight:bold;white-space:pre-line;text-shadow:0 1px #fff}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="score">СЧЁТ 000000</div><button id="pause">Ⅱ</button><div id="speedWrap">СКОРОСТЬ<input id="speed" type="range" min="1" max="10" value="5"></div><button id="jump">ПРЫЖОК</button><div id="message"></div></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('message'),speed=document.getElementById('speed'),jumpBtn=document.getElementById('jump'),pauseBtn=document.getElementById('pause');let W=960,H=540,ground=430,py=ground,vy=0,grounded=true,obs=[],timer=1,score=0,best=0,paused=false,dead=false,last=0,level=5;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;ctx.setTransform(d*W/960,0,0,d*H/540,0,0);ground=430}window.addEventListener('resize',resize);resize();
function restart(){py=ground;vy=0;grounded=true;obs=[];timer=1;score=0;dead=false;paused=false;msg.textContent='';pauseBtn.textContent='Ⅱ'}
function jump(){if(dead){restart();return}if(!paused&&grounded){grounded=false;vy=-720}}
jumpBtn.addEventListener('click',jump);pauseBtn.addEventListener('click',()=>{if(dead){restart();return}paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';msg.textContent=paused?'ПАУЗА':''});
c.addEventListener('pointerdown',e=>{if(e.clientX<c.clientWidth*.72)jump()});speed.addEventListener('input',()=>level=+speed.value);
function pencil(x,h,w){ctx.fillStyle='#d69a45';ctx.fillRect(x-w/2,ground-h,w,h);ctx.strokeStyle='#332e29';ctx.lineWidth=2;ctx.strokeRect(x-w/2,ground-h,w,h);ctx.strokeStyle='#f3c77d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-w/2+4,ground-h+5);ctx.lineTo(x-w/2+4,ground-4);ctx.stroke();ctx.fillStyle='#e1c7a0';ctx.beginPath();ctx.moveTo(x-w/2,ground-h);ctx.lineTo(x,ground-h-13);ctx.lineTo(x+w/2,ground-h);ctx.closePath();ctx.fill();ctx.strokeStyle='#332e29';ctx.stroke()}
function player(){let x=170,y=py;ctx.strokeStyle='#292622';ctx.lineWidth=4;ctx.lineCap='round';ctx.fillStyle='#e9e4d8';ctx.beginPath();ctx.arc(x,y-62,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-49);ctx.lineTo(x-5,y-22);ctx.moveTo(x-3,y-42);ctx.lineTo(x-22,y-29);ctx.moveTo(x-2,y-41);ctx.lineTo(x+18,y-34);if(grounded){ctx.moveTo(x-5,y-22);ctx.lineTo(x-19,y-3);ctx.moveTo(x-5,y-22);ctx.lineTo(x+13,y-2)}else{ctx.moveTo(x-5,y-22);ctx.lineTo(x-23,y-35);ctx.moveTo(x-5,y-22);ctx.lineTo(x+18,y-8)}ctx.stroke()}
function draw(){ctx.fillStyle='#e9e4d8';ctx.fillRect(0,0,960,540);ctx.strokeStyle='rgba(80,70,60,.07)';ctx.lineWidth=1;for(let y=35;y<480;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}ctx.strokeStyle='#39342f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(35,ground+3);ctx.lineTo(920,ground+3);ctx.stroke();player();obs.forEach(o=>pencil(o.x,o.h,o.w));ctx.fillStyle='#777066';ctx.font='14px Arial';ctx.fillText('БЕСКОНЕЧНЫЙ БЕГ • КАРАНДАШНЫЙ МИР',28,510)}
function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(!paused&&!dead){score+=dt*level*2;let speedPx=260+level*45;if(!grounded){vy+=1900*dt;py+=vy*dt;if(py>=ground){py=ground;vy=0;grounded=true}}timer-=dt;if(timer<=0){let h=35+Math.random()*41,w=18+Math.random()*12;obs.push({x:1010,h,w});timer=(1.15+Math.random()*.85)*(6/(level+2))}obs.forEach(o=>o.x-=speedPx*dt);obs=obs.filter(o=>o.x>-70);for(let o of obs){if(170+21>o.x-o.w/2&&170-20<o.x+o.w/2&&py-74<ground&&py-4>ground-o.h){dead=true;best=Math.max(best,Math.floor(score));msg.textContent='СТОЛКНОВЕНИЕ\nСЧЁТ: '+Math.floor(score)+'  РЕКОРД: '+best+'\nНажми ПРЫЖОК для повтора';break}}scoreEl.textContent='СЧЁТ '+String(Math.floor(score)).padStart(6,'0')+'   СКОРОСТЬ '+level+'/10'}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>

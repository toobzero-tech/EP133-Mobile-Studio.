<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>Бегущий человек</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5ef;color:#25231f;font-family:Georgia,serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#pause{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;padding:9px 13px;pointer-events:auto;font-size:13px;letter-spacing:.5px}
#meters{position:absolute;top:58px;left:14px;font-size:14px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px #fff}
#record{position:absolute;top:80px;left:14px;font-size:11px;color:rgba(45,42,35,.65)}
#view{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;padding:9px 11px;pointer-events:auto;font-size:12px;letter-spacing:.4px}
#speedbox{position:absolute;right:8px;top:22%;height:46%;width:46px;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#speed{height:100%;width:30px;writing-mode:vertical-lr;direction:rtl;accent-color:#3a3832;touch-action:pan-y}
#speedlabel{position:absolute;right:0;top:-24px;font-size:12px;font-weight:bold}
button{font-family:Georgia,serif;border:1.5px solid #393730;background:rgba(255,255,255,.91);box-shadow:2px 3px 0 rgba(40,38,32,.24);color:#25231f;border-radius:2px}
button:active{transform:translate(1px,2px);box-shadow:0 1px 0 rgba(40,38,32,.24)}
#menu,#paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background-color:#f7f5ef;background-image:repeating-linear-gradient(7deg,transparent 0 27px,rgba(85,78,62,.025) 28px,transparent 29px 53px),radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.96),rgba(244,241,232,.95))}
#menu{padding:24px}
h1{font-size:clamp(34px,9vw,54px);line-height:.98;letter-spacing:2px;margin:0 0 18px;text-shadow:1px 1px 0 #aaa,2px 2px 0 rgba(80,75,65,.18)}
.sub{font-style:italic;margin:0 0 30px;color:#615d53}
.switch{width:min(240px,75vw);padding:15px;margin:8px;font-size:17px;font-weight:bold;letter-spacing:1px}
#menu small{max-width:260px;margin-top:18px;line-height:1.5;color:#615d53}
#paused{display:none;background:rgba(247,245,239,.91);font-size:30px;font-weight:bold;letter-spacing:2px;gap:18px}
#result{display:none;font-size:15px;line-height:1.8;letter-spacing:.6px;font-weight:normal;color:#514c42;text-align:center}
#paused button{padding:13px 22px;font-size:16px}
#hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:12px Georgia;color:rgba(45,42,35,.58);white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<button id="pause">Ⅱ ПАУЗА</button>
<div id="meters">0 м</div>
<div id="record">РЕКОРД: 0 м</div>
<button id="view">ВИД: СЗАДИ</button>
<div id="speedbox"><span id="speedlabel">5/10</span><input id="speed" type="range" min="1" max="10" value="5" aria-label="Скорость бега"></div>
<div id="hint">ТАП ПО ЛИСТУ — ПРЫЖОК</div>
</div>
<div id="paused"><div id="pauseTitle">ПАУЗА</div><div id="result"></div><button id="resume">▶ ПРОДОЛЖИТЬ</button><button id="restartPause">↻ ЗАНОВО</button></div>
<div id="menu">
<h1>БЕГУЩИЙ<br>ЧЕЛОВЕК</h1>
<div class="sub">Бесконечный бег · рисунок карандашом</div>
<button class="switch" id="start">◉ НАЧАТЬ БЕГ</button>
<button class="switch" id="exit">⟲ В МЕНЮ</button>
<small>Тап по игровой области — прыжок.<br>Ползунок справа — скорость.</small>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const menu=document.getElementById('menu'),pauseLayer=document.getElementById('paused');
const metersEl=document.getElementById('meters'),speedEl=document.getElementById('speed'),speedLabel=document.getElementById('speedlabel');
let W=0,H=0,DPR=1,active=false,paused=false,dead=false,speed=5,clock=0,distance=0,jump=0,objects=[],spawnClock=0,lastFrame=0,paper=null,viewMode=0,record=0,hitFlash=0,particles=[],audioCtx=null,lastFoot=0,cameraKick=0;
try{record=Number(localStorage.getItem('runnerBest')||0)}catch(e){}
document.getElementById('record').textContent='РЕКОРД: '+record+' м';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makePaper();draw();
}
function makePaper(){
  paper=document.createElement('canvas');paper.width=256;paper.height=256;
  const p=paper.getContext('2d');p.fillStyle='#f8f6f0';p.fillRect(0,0,256,256);
  let seed=9137;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=0;i<1900;i++){const a=.012+rnd()*.036;p.fillStyle='rgba(65,59,48,'+a+')';p.fillRect(rnd()*256,rnd()*256,.35+rnd()*1.1,.35+rnd()*1.1)}
  // Sparse paper fibers, barely visible unless the screen is large.
  for(let i=0;i<115;i++){const x=rnd()*256,y=rnd()*256;p.strokeStyle='rgba(90,82,68,'+(.025+rnd()*.035)+')';p.lineWidth=.35;p.beginPath();p.moveTo(x,y);p.lineTo(x+1+rnd()*4,y-.4-rnd()*1.4);p.stroke()}
  const g=p.createLinearGradient(0,0,256,256);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(120,110,90,.025)');p.fillStyle=g;p.fillRect(0,0,256,256);
}
function line(x1,y1,x2,y2,width=1,alpha=.45,color='#34312b'){
  ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1;
}
function hatch(x1,y1,x2,y2,count=5,alpha=.18){
  for(let i=0;i<count;i++){const t=(i+.5)/count;line(x1+(x2-x1)*t-3,y1+(y2-y1)*t+2,x1+(x2-x1)*t+3,y1+(y2-y1)*t-2,.65,alpha)}
}
function drawTrack(){
  const horizon=H*.255,vanish=W*.5,edgeL=W*.035,edgeR=W*.965;
  // Slightly winding hand-drawn path, with perspective curvature.
  const bend=Math.sin(clock*.003)*W*.035;
  ctx.beginPath();ctx.moveTo(vanish-2,horizon);
  ctx.bezierCurveTo(vanish-bend*.35,H*.48,edgeL+bend,H*.72,edgeL,H);
  ctx.strokeStyle='rgba(48,45,38,.28)';ctx.lineWidth=1.25;ctx.stroke();
  ctx.beginPath();ctx.moveTo(vanish+2,horizon);
  ctx.bezierCurveTo(vanish+bend*.35,H*.48,edgeR+bend,H*.72,edgeR,H);
  ctx.stroke();
  line(vanish-5,horizon+5,edgeL+13,H,1,.12);line(vanish+5,horizon+5,edgeR-13,H,1,.12);
  for(let i=0;i<11;i++){
    const t=((i/11)+(clock*.012*speed/5))%1;
    const y=horizon+Math.pow(t,1.55)*(H-horizon);
    const half=4+Math.pow(t,1.2)*W*.45;
    line(vanish-half,y,vanish+half,y,.8,.10);
  }
  // graphite road-edge hatching, deliberately sparse for mobile performance
  for(let i=0;i<22;i++){
    const t=(i/22+clock*.006*speed/5)%1,y=horizon+Math.pow(t,1.55)*(H-horizon),spread=8+Math.pow(t,1.25)*W*.45;
    line(vanish-spread,y,vanish-spread-5,y+8,.7,.10);
    line(vanish+spread,y,vanish+spread+5,y+8,.7,.10);
  }
  // Layered graphite perspective: soft ground grain, broken wheel/running scuffs and hand-drawn edge strokes.
  for(let i=0;i<58;i++){
    const t=((i*.618+clock*.0018*speed)%1),y=horizon+Math.pow(t,1.7)*(H-horizon);
    const x=vanish+(Math.sin(i*17.31)*.78)*Math.pow(t,1.2)*W*.42;
    const len=2+Math.pow(t,1.4)*13;
    line(x,y,x+len,y-1.4,.55,.055);
    if(i%3===0)line(x+len*.4,y+1,x+len*.4+len*.55,y+.1,.45,.045);
  }
  // Faint, irregular center guide fades into the paper rather than looking like a road marking.
  for(let i=0;i<15;i++){
    const t=((i/15+clock*.004*speed)%1),y=horizon+Math.pow(t,1.65)*(H-horizon);
    const x=vanish+Math.sin(i*2.17+clock*.004)*Math.pow(t,1.4)*W*.018;
    const w=.4+Math.pow(t,1.3)*1.1;
    line(x-w,y,x+w,y,.55,.10);
  }
  // Short cross-hatching along the near track edges, scaled with perspective.
  for(let i=0;i<26;i++){
    const t=((i/26+clock*.008*speed)%1),y=horizon+Math.pow(t,1.55)*(H-horizon);
    const spread=7+Math.pow(t,1.25)*W*.44, h=2+Math.pow(t,1.2)*7;
    line(vanish-spread,y,vanish-spread-h,y-h,.55,.09);
    line(vanish+spread,y,vanish+spread+h,y-h,.55,.09);
  }
}
function limb(ax,ay,bx,by,r1,r2,shade=.1){
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  ctx.beginPath();ctx.moveTo(ax+nx*r1,ay+ny*r1);
  ctx.quadraticCurveTo((ax+bx)/2+nx*(r1+r2)*.62,(ay+by)/2+ny*(r1+r2)*.62,bx+nx*r2,by+ny*r2);
  ctx.lineTo(bx-nx*r2,by-ny*r2);
  ctx.quadraticCurveTo((ax+bx)/2-nx*(r1+r2)*.62,(ay+by)/2-ny*(r1+r2)*.62,ax-nx*r1,ay-ny*r1);
  ctx.closePath();ctx.fillStyle='rgba(55,52,45,'+shade+')';ctx.fill();ctx.strokeStyle='#302e29';ctx.lineWidth=1.45;ctx.stroke();
  for(let i=1;i<5;i++){const t=i/5;line(ax+(bx-ax)*t-2,ay+(by-ay)*t+2,bx-(bx-ax)*(1-t)+2,by-(by-ay)*(1-t)-2,.55,.22)}
}
function runner(px,py,zoom=1){
  const phase=clock*speed*.105,sw=Math.sin(phase),stride=Math.cos(phase);
  const lift=jump>0?Math.sin(jump*Math.PI)*H*.145:0;
  const tuck=jump>0?Math.sin(jump*Math.PI):0;
  const armLift=tuck*9;
  const landing=jump>0?Math.pow(1-Math.sin(jump*Math.PI),5):0;
  // A small vertical compression on alternating footfalls gives the stride
  // weight. The torso counter-rotates slightly instead of sliding rigidly.
  const runBob=jump===0?Math.abs(Math.sin(phase*2))*2.15:0;
  const torsoSway=jump===0?Math.sin(phase)*.012:0;
  ctx.save();ctx.translate(px+Math.sin(phase)*1.15,py-lift+runBob);ctx.rotate(-tuck*.035+torsoSway);ctx.scale(zoom*(1+landing*.055),zoom*(1-landing*.065));
  // soft graphite shadow
  ctx.fillStyle='rgba(35,32,27,'+(jump>0?.07:.15)+')';ctx.beginPath();ctx.ellipse(0,5+jump*15,22+jump*15,5,0,0,Math.PI*2);ctx.fill();
  // back leg and shoe
  limb(7,-19,15-stride*10-tuck*7,3-tuck*10,6.5,4.4,.17);limb(15-stride*10-tuck*7,3-tuck*10,22-stride*14,19-tuck*13,4.3,2.5,.12);
  limb(22-stride*14,19-tuck*13,30-stride*14,20-tuck*13,2.8,1.5,.22);
  // torso, shoulder and pelvis
  ctx.beginPath();ctx.moveTo(-8,-66);ctx.quadraticCurveTo(-17,-61,-18,-49);ctx.lineTo(-13,-28);ctx.quadraticCurveTo(0,-22,13,-28);ctx.lineTo(18,-49);ctx.quadraticCurveTo(17,-61,8,-66);ctx.quadraticCurveTo(0,-61,-8,-66);ctx.closePath();
  ctx.fillStyle='rgba(54,51,44,.16)';ctx.fill();ctx.strokeStyle='#292721';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-12,-30);ctx.quadraticCurveTo(0,-23,12,-30);ctx.lineTo(10,-17);ctx.quadraticCurveTo(0,-12,-10,-17);ctx.closePath();ctx.fillStyle='rgba(50,47,40,.2)';ctx.fill();ctx.stroke();
  // Directional graphite shading on the shirt, shoulder volume and lower-back folds.
  const shirtShade=ctx.createLinearGradient(-18,-58,18,-27);
  shirtShade.addColorStop(0,'rgba(30,28,24,.20)');shirtShade.addColorStop(.48,'rgba(75,70,60,.035)');shirtShade.addColorStop(1,'rgba(25,23,20,.16)');
  ctx.fillStyle=shirtShade;ctx.beginPath();ctx.moveTo(-14,-59);ctx.quadraticCurveTo(0,-68,14,-59);ctx.lineTo(17,-35);ctx.quadraticCurveTo(0,-26,-17,-35);ctx.closePath();ctx.fill();
  // Shoulder seams, fabric tension and fine graphite cross-hatching.
  line(-15,-57,-7,-62,.75,.38);line(15,-57,7,-62,.75,.38);
  for(let i=0;i<9;i++){const yy=-56+i*2.7;line(-12+(i%3)*1.4,yy,11-(i%4)*1.2,yy+3,.48,.13)}
  line(-11,-31,-3,-28,.7,.25);line(3,-28,12,-32,.7,.24);
  // shoulder blades and fabric folds
  line(-10,-55,-2,-47,.8,.3);line(8,-56,2,-45,.8,.3);line(-8,-37,2,-32,.7,.25);line(3,-42,11,-36,.7,.2);
  for(let i=0;i<7;i++){const yy=-58+i*4;line(-7+(i%2),yy,6-(i%3),yy+2,.6,.18)}
  // arms counter-swing
  limb(-14,-57,-21+sw*7,-39-armLift,4.6,3.2,.12);limb(-21+sw*7,-39-armLift,-25+sw*10,-22-armLift*1.35,3.2,2.1,.10);
  limb(14,-57,21-sw*7,-40-armLift,4.6,3.2,.12);limb(21-sw*7,-40-armLift,25-sw*10,-23-armLift*1.35,3.2,2.1,.10);
  // front leg
  limb(-7,-19,-15+stride*10-tuck*6,2-tuck*11,6.8,4.6,.2);limb(-15+stride*10-tuck*6,2-tuck*11,-19+stride*14,18-tuck*8,4.5,2.5,.14);
  limb(-19+stride*14,18-tuck*8,-28+stride*14,20-tuck*8,2.8,1.5,.2);
  // neck and head
  ctx.fillStyle='rgba(75,68,58,.16)';ctx.strokeStyle='#292721';ctx.lineWidth=1.7;
  ctx.fillRect(-4,-69,8,9);ctx.strokeRect(-4,-69,8,9);
  ctx.beginPath();ctx.ellipse(0,-80,9.2,12,-.08,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Hair silhouette and nape make the rear-facing head read as a real runner.
  ctx.beginPath();ctx.moveTo(-8,-84);ctx.quadraticCurveTo(-10,-96,-2,-97);ctx.quadraticCurveTo(7,-98,9,-87);ctx.lineTo(6,-91);ctx.lineTo(2,-88);ctx.lineTo(-2,-92);ctx.lineTo(-6,-87);ctx.closePath();
  ctx.fillStyle='rgba(38,35,30,.30)';ctx.fill();ctx.strokeStyle='#292721';ctx.lineWidth=1.1;ctx.stroke();
  for(let i=0;i<6;i++)line(-6+i*2,-92-(i%2)*2,-4+i*2,-89,.55,.28);
  line(-7,-83,-3,-87,.8,.3);line(2,-88,6,-84,.7,.25);line(-5,-75,4,-73,.65,.2);
  // Graphite contour accents, fabric seams and shoe tread.
  line(-17,-49,-13,-34,.65,.28);line(17,-49,13,-34,.65,.28);
  line(-7,-63,0,-60,.6,.24);line(7,-63,1,-59,.6,.24);
  line(-10,-27,-2,-24,.7,.3);line(2,-24,10,-27,.7,.3);
  for(let i=0;i<4;i++){
    line(-29+i*2,19,-27+i*2,21,.55,.34);
    line(25+i*1.5,19,27+i*1.5,21,.55,.34);
  }
  // Shoe uppers, heel counters and outsole tread, moving with each stride.
  line(-27+stride*14,19-tuck*8,-22+stride*14,16-tuck*8,.7,.32);
  line(24-stride*14,19-tuck*13,29-stride*14,16-tuck*13,.7,.30);
  line(-30+stride*14,21-tuck*8,-20+stride*14,22-tuck*8,.85,.42);
  line(24-stride*14,21-tuck*13,34-stride*14,22-tuck*13,.85,.40);
  // Small graphite motion accents follow the runner rather than the camera.
  if(jump===0){line(-33+sw*2,4,-37+sw*2,7,.55,.12);line(32-sw*2,7,36-sw*2,10,.55,.12)}
  ctx.restore();
}
function obstacle(o){
  const s=.22+o.z*1.42,y=H*.255+Math.pow(o.z,1.55)*H*.53,px=W*.5+o.lane*s;
  ctx.save();ctx.translate(px,y);
  // Contact shadow and soft graphite underdrawing.
  ctx.scale(s,s);ctx.fillStyle='rgba(35,32,27,.10)';ctx.beginPath();ctx.ellipse(0,7,54,7,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(35,32,27,.24)';ctx.lineWidth=5;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#302e29';ctx.lineWidth=2.35;ctx.lineJoin='round';ctx.fillStyle='rgba(55,51,43,.075)';
  if(o.kind===0){
    // Fallen timber with bark ridges and broken end grain.
    ctx.beginPath();ctx.moveTo(-54,-2);ctx.quadraticCurveTo(-42,-12,-25,-8);ctx.lineTo(45,-7);ctx.quadraticCurveTo(58,-4,52,5);ctx.lineTo(-48,8);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=0;i<12;i++){
      const x=-43+i*7.6;line(x,-5-(i%3),x+5,-10-(i%4),.8,.30);
      if(i%2===0)line(x+1,2,x+7,4,.6,.22);
    }
    ctx.beginPath();ctx.ellipse(-49,1,4,7,-.2,0,Math.PI*2);ctx.stroke();
    hatch(-42,-2,43,2,13,.22);
  }else if(o.kind===1){
    // Three-dimensional hand-built hurdle with side braces and worn edges.
    ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(-17,-51);ctx.quadraticCurveTo(0,-57,18,-49);ctx.lineTo(39,0);ctx.closePath();ctx.fill();ctx.stroke();
    line(-17,-50,-10,-4,1.1,.30);line(18,-49,10,-4,1.1,.28);
    line(-24,-17,25,-17,2,.42);line(-30,-4,31,-4,2,.42);
    line(-17,-28,0,-25,1,.25);line(2,-27,17,-30,1,.24);
    hatch(-15,-42,14,-42,7,.27);hatch(-28,-8,28,-8,9,.18);
    line(-39,1,-31,4,.9,.25);line(31,4,40,1,.9,.25);
  }else{
    // Irregular chipped stone with layered facets.
    ctx.beginPath();ctx.moveTo(-34,-4);ctx.lineTo(-27,-25);ctx.lineTo(-10,-30);ctx.lineTo(2,-24);ctx.lineTo(23,-27);ctx.lineTo(35,-7);ctx.lineTo(28,3);ctx.lineTo(-27,4);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-27,-23);ctx.lineTo(-8,-18);ctx.lineTo(2,-24);ctx.lineTo(8,-7);ctx.lineTo(-12,-4);ctx.closePath();ctx.stroke();
    line(-17,-20,-3,-9,.9,.32);line(10,-22,22,-10,.9,.30);line(-7,-4,5,2,.7,.25);
    hatch(-22,-3,23,-2,9,.24);hatch(-18,-22,18,-22,6,.15);
  }
  // Loose graphite fragments and ground contact marks.
  for(let i=0;i<5;i++){const x=-28+i*13;line(x,8,x+3,10,.55,.18)}
  ctx.restore();
}
function firstPerson(){
  const swing=Math.sin(clock*speed*.105),lift=jump>0?Math.sin(jump*Math.PI):0;
  ctx.save();
  const arm=(side)=>{
    ctx.save();ctx.translate(W*.5+side*W*.31,H*.91-lift*H*.07);ctx.rotate(side*(.18+swing*.08));
    ctx.beginPath();ctx.moveTo(side*-7,-5);ctx.quadraticCurveTo(side*-24,-42,side*-17,-75);
    ctx.lineTo(side*-4,-82);ctx.quadraticCurveTo(side*3,-55,side*8,-34);ctx.lineTo(side*17,0);ctx.closePath();
    ctx.fillStyle='rgba(55,52,45,.19)';ctx.fill();ctx.strokeStyle='#302e29';ctx.lineWidth=2;ctx.stroke();
    for(let i=0;i<8;i++)line(side*(-13+i*2),-65+i*4,side*(-4+i*2),-61+i*4,.7,.25);
    ctx.beginPath();ctx.ellipse(0,-83,9,12,0,0,Math.PI*2);ctx.fillStyle='rgba(105,96,82,.18)';ctx.fill();ctx.stroke();
    for(let i=0;i<5;i++)line(side*(-6+i*3),-88,side*(-7+i*3),-80,.6,.3);
    ctx.restore();
  };
  arm(-1);arm(1);ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a*.42;ctx.strokeStyle='#38352e';ctx.lineWidth=p.width;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.stroke();
    if(p.grain){ctx.globalAlpha=a*.22;ctx.fillStyle='#494438';ctx.beginPath();ctx.arc(p.x,p.y,p.width*1.2,0,Math.PI*2);ctx.fill()}
  }
  ctx.globalAlpha=1;
}
function burst(x,y,count,force){
  for(let i=0;i<count;i++){
    const angle=(-Math.PI*.92)+(Math.random()*Math.PI*.84);
    const v=force*(.35+Math.random()*.85);
    particles.push({x:x+(Math.random()-.5)*20,y:y+(Math.random()-.5)*4,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v*.55,life:16+Math.random()*20,maxLife:36,width:.45+Math.random()*1.05,grain:Math.random()<.55});
  }
  if(particles.length>130)particles.splice(0,particles.length-130);
}
function sound(kind){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
    o.type=kind==='jump'?'triangle':'sine';o.frequency.setValueAtTime(kind==='jump'?170:82,t);o.frequency.exponentialRampToValueAtTime(kind==='jump'?420:43,t+.11);
    f.type='lowpass';f.frequency.value=kind==='jump'?1200:260;g.gain.setValueAtTime(kind==='jump'?.0001:.0001,t);g.gain.exponentialRampToValueAtTime(kind==='jump'?.045:.075,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+(kind==='jump'?.16:.22));
    o.connect(f);f.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.24);
  }catch(e){}
}
function draw(){
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  if(paper){ctx.fillStyle=ctx.createPattern(paper,'repeat');ctx.fillRect(0,0,W,H)}
  const sway=Math.sin(clock*.105)*Math.min(1,speed/7)*1.15;
  const shake=cameraKick*Math.sin(clock*1.7)*.42;
  ctx.save();ctx.translate(sway+shake,Math.abs(Math.sin(clock*.21))*1.0);
  drawTrack();
  objects.slice().sort((a,b)=>a.z-b.z).forEach(obstacle);
  const warningStart=clamp(1-speed*.00155*38,.35,.94);
  const warning=objects.find(o=>!o.checked&&o.lane===0&&o.z>warningStart&&o.z<.99);
  if(warning){const pulse=.45+.35*Math.sin(clock*.22);ctx.fillStyle='rgba(55,50,42,'+pulse+')';ctx.font='bold 12px Georgia';ctx.textAlign='center';ctx.fillText(warning.kind===1?'ВЫСОКИЙ ПРЫЖОК':'ПРЫЖОК',W*.5,H*.34)}
  if(hitFlash>0){ctx.fillStyle='rgba(80,45,35,'+(hitFlash*.12)+')';ctx.fillRect(0,0,W,H)}
  if(viewMode===2)firstPerson();
  else runner(W*.5,H*(viewMode===1?.82:.775),viewMode===1?1.38:.98);
  drawParticles();ctx.restore();
}
function reset(){
  active=true;paused=false;dead=false;clock=0;distance=0;jump=0;hitFlash=0;objects=[];particles=[];cameraKick=0;spawnClock=.65;lastFrame=0;
  metersEl.textContent='0 м';menu.style.display='none';pauseLayer.style.display='none';
  // A restart after a collision must restore the resume control. Otherwise
  // the next pause opens an overlay with no way back into the run.
  document.getElementById('pauseTitle').textContent='ПАУЗА';
  document.getElementById('result').style.display='none';
  document.getElementById('resume').style.display='block';
  document.getElementById('restartPause').textContent='↻ ЗАНОВО';
  document.getElementById('pause').textContent='Ⅱ ПАУЗА';
}
function finish(){
  active=false;dead=true;paused=false;
  const score=Math.floor(distance);if(score>record){record=score;try{localStorage.setItem('runnerBest',String(record))}catch(e){}document.getElementById('record').textContent='РЕКОРД: '+record+' м'}
  document.getElementById('pauseTitle').textContent='СТОЛКНОВЕНИЕ';
  document.getElementById('result').innerHTML='ДИСТАНЦИЯ: <b>'+score+' м</b><br>ЛУЧШИЙ РЕЗУЛЬТАТ: <b>'+record+' м</b>';
  document.getElementById('result').style.display='block';
  document.getElementById('resume').style.display='none';
  document.getElementById('restartPause').textContent='↻ ЗАНОВО';
  pauseLayer.style.display='flex';
}
function frame(ts){
  if(!lastFrame)lastFrame=ts;
  const dt=clamp((ts-lastFrame)/16.667,0,2);lastFrame=ts;
  if(active&&!paused&&!dead){
    clock+=dt;distance+=speed*.012*dt;
    spawnClock-=dt;
    if(spawnClock<=0){
      // There is no lateral steering in this control scheme: every obstacle
      // belongs to the runner's lane. Side-lane spawns were visual noise that
      // could never be dodged or collided with.
      const kindRoll=Math.random();
      const kind=kindRoll<.38?0:(kindRoll<.70?1:2);
      objects.push({z:0,lane:0,kind,checked:false});
      // Keep a readable reaction window at high speed and avoid overlapping
      // obstacle silhouettes. Difficulty comes from travel speed, not unfair
      // random clusters.
      const reactionGap=1.82-speed*.065;
      spawnClock=clamp(reactionGap,1.12,1.75)*(0.92+Math.random()*.16);
    }
    for(const o of objects){
      o.z+=speed*.00155*dt;
      // Collision is evaluated when the obstacle reaches the runner's foot plane (z=1.0).
      if(!o.checked&&o.z>=1.0){
        o.checked=true;
        const arc=Math.sin(clamp(jump,0,1)*Math.PI);
        const clearance=o.kind===1?.68:.46;
        const cleared=arc>clearance;
        if(Math.abs(o.lane)<.05&&!cleared){hitFlash=1;finish();break}
      }
    }
    objects=objects.filter(o=>o.z<1.16);
    const wasJumping=jump>0;
    if(jump>0)jump=Math.max(0,jump-.018*dt);
    if(wasJumping&&jump===0){burst(W*.5,H*.775+4,24,2.7);sound('land');cameraKick=5;try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}}
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.vx*=Math.pow(.985,dt);p.life-=dt;}
    particles=particles.filter(p=>p.life>0);cameraKick=Math.max(0,cameraKick-.42*dt);
    hitFlash=Math.max(0,hitFlash-.055*dt);
    metersEl.textContent=Math.floor(distance)+' м';
  }
  draw();requestAnimationFrame(frame);
}
canvas.addEventListener('pointerdown',e=>{
  if(e.cancelable)e.preventDefault();
  if(active&&!paused&&!dead&&jump===0){jump=1;sound('jump');burst(W*.5,H*.775+8,9,1.25);try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}
},{passive:false});
speedEl.addEventListener('input',e=>{speed=Number(e.target.value);speedLabel.textContent=speed+'/10'});
document.getElementById('pause').addEventListener('click',()=>{
  if(!active||dead)return;
  paused=!paused;pauseLayer.style.display=paused?'flex':'none';
  document.getElementById('pauseTitle').textContent='ПАУЗА';
  document.getElementById('resume').style.display='block';
  document.getElementById('restartPause').textContent='↻ ЗАНОВО';
});
document.getElementById('resume').addEventListener('click',()=>{
  if(dead)return;paused=false;lastFrame=0;pauseLayer.style.display='none';
});
document.getElementById('restartPause').addEventListener('click',reset);
document.getElementById('start').addEventListener('click',reset);
document.getElementById('view').addEventListener('click',()=>{viewMode=(viewMode+1)%3;document.getElementById('view').textContent=['ВИД: СЗАДИ','ВИД: БЛИЖЕ','ВИД: ОТ 1 ЛИЦА'][viewMode];draw()});
document.getElementById('exit').addEventListener('click',()=>{
  active=false;paused=false;dead=false;objects=[];pauseLayer.style.display='none';menu.style.display='flex';
});
// Android system Back: pause during a run; a second press from pause
// returns to the title screen. From the title screen Android handles Back.
window.handleAndroidBack=()=>{
  if(active&&!paused&&!dead){
    paused=true;pauseLayer.style.display='flex';
    document.getElementById('pauseTitle').textContent='ПАУЗА';
    document.getElementById('result').style.display='none';
    document.getElementById('resume').style.display='block';
    document.getElementById('restartPause').textContent='↻ ЗАНОВО';
    return true;
  }
  if(active&&paused){
    active=false;paused=false;pauseLayer.style.display='none';menu.style.display='flex';
    return true;
  }
  if(dead){
    dead=false;pauseLayer.style.display='none';menu.style.display='flex';
    return true;
  }
  return false;
};
// Do not let a backgrounded app silently advance or resume a run.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&active&&!paused&&!dead){
    paused=true;pauseLayer.style.display='flex';
    document.getElementById('pauseTitle').textContent='ПАУЗА';
    document.getElementById('resume').style.display='block';
    document.getElementById('restartPause').textContent='↻ ЗАНОВО';
  }
  lastFrame=0;
});
window.addEventListener('resize',resize,{passive:true});
resize();requestAnimationFrame(frame);
})();
</script>
</body>

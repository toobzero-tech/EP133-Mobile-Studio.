<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e9e4d8"><title>Бегущий человек</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4d8;font-family:Arial,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;color:#292622;pointer-events:none}.panel{background:rgba(235,229,216,.9);border:1.5px solid #51483d;box-shadow:2px 3px 0 rgba(50,42,32,.15);border-radius:9px}
#score{position:absolute;left:3%;top:3%;padding:8px 11px;font-weight:bold;font-size:clamp(12px,2.7vw,22px);letter-spacing:1px}
button{font-family:inherit;color:#292622;font-weight:bold;pointer-events:auto;border:2px solid #39342f;border-radius:10px;background:#d6cfc0;box-shadow:0 3px 0 #8b8172}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8b8172}
#pause{position:absolute;right:3%;top:3%;width:48px;height:44px;font-size:22px}
#speedWrap{position:absolute;right:3%;top:17%;height:43%;width:52px;display:flex;align-items:center;justify-content:space-around;flex-direction:column;padding:7px 2px;font-size:10px;font-weight:bold;letter-spacing:.5px}
#speed{height:75%;width:24px;writing-mode:vertical-lr;direction:rtl;accent-color:#c77c2b;pointer-events:auto}
#jump{position:absolute;right:12%;bottom:5%;width:25%;height:15%;min-width:100px;max-width:180px;background:#d69a45;font-size:clamp(15px,3vw,22px)}
#views{position:absolute;left:3%;bottom:5%;display:flex;gap:5px;pointer-events:auto}
#views button{padding:8px 9px;font-size:clamp(9px,1.8vw,13px);background:#ded7c9}
#views button.active{background:#d69a45}
#message{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:min(82%,420px);padding:18px;text-align:center;font-size:clamp(17px,4vw,28px);font-weight:bold;white-space:pre-line;line-height:1.45;pointer-events:auto}
#message button{padding:10px 22px;margin-top:12px;background:#d69a45;font-size:16px}
#hint{position:absolute;left:50%;top:3%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;opacity:.55;white-space:nowrap}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="score" class="panel">СЧЁТ 000000</div><div id="hint">БЕСКОНЕЧНЫЙ БЕГ · КАРАНДАШНЫЙ МИР</div><button id="pause">Ⅱ</button><div id="speedWrap" class="panel">СКОРОСТЬ<input id="speed" type="range" min="1" max="10" value="5"><span id="speedVal">5 / 10</span></div><div id="views"><button data-view="side" class="active">ПРОФИЛЬ</button><button data-view="three">¾</button><button data-view="front">СПЕРЕДИ</button></div><button id="jump">ПРЫЖОК</button><div id="message"></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('message'),speed=document.getElementById('speed'),speedVal=document.getElementById('speedVal'),jumpBtn=document.getElementById('jump'),pauseBtn=document.getElementById('pause');
let W=960,H=540,ground=430,py=ground,vy=0,grounded=true,obs=[],timer=1,score=0,best=Number(localStorage.getItem('rmBest')||0),paused=true,dead=false,last=0,level=5,view='side',runTime=0,started=false,world=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;ctx.setTransform(d*W/960,0,0,d*H/540,0,0);ground=430}window.addEventListener('resize',resize);resize();
function start(){py=ground;vy=0;grounded=true;obs=[];timer=1;score=0;dead=false;paused=false;started=true;runTime=0;msg.innerHTML='';pauseBtn.textContent='Ⅱ'}
function jump(){if(!started||dead){start();return}if(!paused&&grounded){grounded=false;vy=-735}}
jumpBtn.addEventListener('click',jump);pauseBtn.addEventListener('click',()=>{if(dead||!started){start();return}paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';showMessage(paused?'ПАУЗА':'')});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b))}));
speed.addEventListener('input',()=>{level=+speed.value;speedVal.textContent=level+' / 10'});
c.addEventListener('pointerdown',e=>{if(e.clientX<c.clientWidth*.72)jump()});
function showMessage(text){if(!text){msg.innerHTML='';return}msg.textContent=text}
function line(points,width=3,color='#292622'){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function pencilTexture(x,y,w,h){ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle='#765d40';ctx.lineWidth=1;for(let i=0;i<7;i++){let yy=y+8+i*h/8;ctx.beginPath();ctx.moveTo(x+3,yy);ctx.lineTo(x+w-3,yy-3);ctx.stroke()}ctx.restore()}
function pencil(x,h,w){let y=ground-h;ctx.save();ctx.fillStyle='#d49a4c';ctx.strokeStyle='#332d27';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(x-w/2,y+7);ctx.lineTo(x-w/2+3,y);ctx.lineTo(x+w/2-4,y);ctx.lineTo(x+w/2,y+7);ctx.lineTo(x+w/2,ground);ctx.lineTo(x-w/2,ground);ctx.closePath();ctx.fill();ctx.stroke();pencilTexture(x-w/2,y,w,h);ctx.fillStyle='#e6c99a';ctx.beginPath();ctx.moveTo(x-w/2,y+1);ctx.lineTo(x,y-16);ctx.lineTo(x+w/2,y+1);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#3d3934';ctx.beginPath();ctx.moveTo(x-3,y-11);ctx.lineTo(x,y-16);ctx.lineTo(x+3,y-11);ctx.fill();ctx.restore()}
function obstacle(o){if(o.type==='eraser'){ctx.save();let y=ground-o.h;ctx.fillStyle='#c98b83';ctx.strokeStyle='#332d27';ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(o.x-o.w/2,y,o.w,o.h,5);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(o.x-o.w/2+4,y+5,o.w-8,4);ctx.restore()}else if(o.type==='ruler'){ctx.save();let y=ground-o.h;ctx.fillStyle='#d8bd83';ctx.strokeStyle='#332d27';ctx.lineWidth=2;ctx.fillRect(o.x-o.w/2,y,o.w,o.h);ctx.strokeRect(o.x-o.w/2,y,o.w,o.h);ctx.strokeStyle='#66543b';ctx.lineWidth=1;for(let i=0;i<o.w-5;i+=9){ctx.beginPath();ctx.moveTo(o.x-o.w/2+4+i,y);ctx.lineTo(o.x-o.w/2+4+i,y+(i%3===0?o.h*.7:o.h*.35));ctx.stroke()}ctx.restore()}else if(o.type==='stack'){pencil(o.x,o.h,o.w);pencil(o.x+o.w*.65,o.h*.82,o.w*.72)}else{pencil(o.x,o.h,o.w)}}
function limb(a,b,cx,cy,th=4){line([[a,b],[cx,cy]],th);line([[a+1,b-1],[cx+1,cy-1]],1,'#817365')}
function drawRunner(x,y,t){ctx.save();ctx.translate(x,y);if(view==='front')ctx.scale(1.12,1);else if(view==='three')ctx.scale(1.04,1);
const phase=Math.sin(t*11),lift=Math.max(0,phase)*14;
ctx.fillStyle='rgba(45,39,31,.13)';ctx.beginPath();ctx.ellipse(0,0,30+lift*.25,5,0,0,Math.PI*2);ctx.fill();
// legs, alternating with articulated knees
let stride=phase*23, knee1=stride*.55-8,knee2=-stride*.55-8;
if(!grounded){stride=18;knee1=-18;knee2=18}
ctx.strokeStyle='#292622';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';
line([[-5,-27],[knee1,-14],[stride,-3]],5);line([[4,-27],[knee2,-13],[-stride*.75,-5]],5);
line([[stride-9,-3],[stride+4,-2]],4);line([[-stride*.75-8,-5],[-stride*.75+4,-4]],4);
ctx.strokeStyle='#8b7d6b';ctx.lineWidth=1;line([[-5,-28],[knee1,-15],[stride,-4]],1);line([[4,-28],[knee2,-14],[-stride*.75,-6]],1);
// torso and shirt
ctx.fillStyle='#b8aa94';ctx.strokeStyle='#292622';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-9,-72);ctx.quadraticCurveTo(-17,-61,-10,-31);ctx.lineTo(9,-29);ctx.quadraticCurveTo(17,-54,10,-72);ctx.closePath();ctx.fill();ctx.stroke();
line([[-7,-65],[0,-43],[8,-65]],1.2,'#776a5b');line([[-8,-36],[8,-36]],1,'#5d5348');
// arms
let arm=phase*12;
line([[-10,-65],[-20,-51-arm*.3],[-16+arm*.45,-39]],5);line([[10,-65],[20,-52+arm*.3],[15-arm*.45,-39]],5);
line([[-20,-51-arm*.3],[-16+arm*.45,-39]],1,'#8a7c6b');line([[20,-52+arm*.3],[15-arm*.45,-39]],1,'#8a7c6b');
// neck and head
ctx.fillStyle='#d9c9ad';ctx.strokeStyle='#292622';ctx.lineWidth=2.7;ctx.beginPath();ctx.ellipse(0,-83,5,8,0,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.beginPath();ctx.ellipse(view==='front'?0:2,-101,13,16,view==='front'?0:-.12,0,Math.PI*2);ctx.fillStyle='#e4d5bd';ctx.fill();ctx.stroke();
ctx.strokeStyle='#9b8b75';ctx.lineWidth=1;ctx.beginPath();ctx.arc(1,-102,9,.2,2.5);ctx.stroke();
if(view!=='front'){line([[10,-101],[14,-98],[10,-96]],1.5);ctx.fillStyle='#292622';ctx.beginPath();ctx.arc(7,-105,1.5,0,7);ctx.fill()}
else{ctx.fillStyle='#292622';ctx.beginPath();ctx.arc(-5,-103,1.3,0,7);ctx.arc(5,-103,1.3,0,7);ctx.fill();line([[-3,-94],[3,-94]],1)}
// graphite sketch accents
ctx.globalAlpha=.35;line([[-12,-74],[-8,-68],[-9,-58]],1,'#66594a');line([[11,-74],[7,-65],[10,-56]],1,'#66594a');ctx.restore()}
function background(dt){ctx.fillStyle='#e9e4d8';ctx.fillRect(0,0,960,540);ctx.strokeStyle='rgba(90,76,58,.07)';ctx.lineWidth=1;for(let y=25;y<500;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}for(let x=0;x<960;x+=60){let xx=(x-world*.25%60+60)%960;ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,ground);ctx.stroke()}ctx.fillStyle='rgba(150,132,105,.10)';ctx.fillRect(0,ground+5,960,110);ctx.strokeStyle='#39342f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(28,ground+3);ctx.lineTo(930,ground+3);ctx.stroke();ctx.strokeStyle='rgba(57,52,47,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(28,ground+9);ctx.lineTo(930,ground+9);ctx.stroke()}
function draw(t,dt){background(dt);obs.forEach(obstacle);let lift=ground-py;drawRunner(170,py,t);ctx.fillStyle='#6f675d';ctx.font='12px Arial';ctx.fillText('БЕГИ. ПРЫГАЙ. НЕ ОСТАНАВЛИВАЙСЯ.',28,510)}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;if(!paused&&!dead&&started){runTime+=dt;score+=dt*level*2;world+=(260+level*45)*dt;let v=260+level*45;if(!grounded){vy+=1900*dt;py+=vy*dt;if(py>=ground){py=ground;vy=0;grounded=true}}timer-=dt;if(timer<=0){let type=['pencil','eraser','ruler','stack'][Math.floor(Math.random()*4)];let h=type==='ruler'?24:type==='eraser'?38+Math.random()*22:type==='stack'?72:34+Math.random()*42;let w=type==='ruler'?72:type==='eraser'?30:type==='stack'?24:18+Math.random()*13;obs.push({x:1010,h,w,type});timer=(1.25+Math.random()*.9)*(6/(level+2))}obs.forEach(o=>o.x-=v*dt);obs=obs.filter(o=>o.x>-70);for(let o of obs){let playerBottom=py-4,playerTop=py-116;if(170+19>o.x-o.w/2&&170-17<o.x+o.w/2&&playerBottom>ground-o.h&&playerTop<ground){dead=true;best=Math.max(best,Math.floor(score));localStorage.setItem('rmBest',String(best));msg.innerHTML='СТОЛКНОВЕНИЕ<br>СЧЁТ: '+Math.floor(score)+' · РЕКОРД: '+best+'<br><button id="retry">ЕЩЁ РАЗ</button>';document.getElementById('retry').onclick=start;break}}scoreEl.textContent='СЧЁТ '+String(Math.floor(score)).padStart(6,'0')+' · РЕКОРД '+String(best).padStart(6,'0')}else if(!started){runTime=ts/1000}
draw(runTime,dt);requestAnimationFrame(frame)}
msg.innerHTML='БЕГУЩИЙ ЧЕЛОВЕК<br><span style="font-size:14px;font-weight:normal">Бесконечный карандашный забег</span><br><button id="play">НАЧАТЬ</button>';document.getElementById('play').onclick=start;requestAnimationFrame(frame);
})();
</script></body></html>

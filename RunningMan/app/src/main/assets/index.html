<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>Бегущий человек</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5ef;color:#292720;font-family:Georgia,serif;touch-action:none;user-select:none}#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none}.glass{pointer-events:auto;background:#faf8f1cc;border:1px solid #37332e88;border-radius:3px;color:#292720;box-shadow:0 2px 7px #332e2418;font:600 12px Georgia;letter-spacing:.7px;padding:10px 12px;backdrop-filter:blur(4px)}#pauseBtn{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;width:42px;height:40px;font-size:18px}#score{position:absolute;top:62px;left:14px;font-size:21px;font-weight:bold;text-shadow:0 1px #fff}#best{position:absolute;top:89px;left:15px;font-size:10px;letter-spacing:1px;color:#625d52}#viewBtn{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px}#speedPanel{position:absolute;right:8px;top:24%;height:43%;width:50px;pointer-events:auto;display:flex;align-items:center;justify-content:center}#speed{height:100%;width:32px;writing-mode:vertical-lr;direction:rtl;accent-color:#37342e;touch-action:pan-y}#speedValue{position:absolute;right:0;top:-24px;font:bold 12px Georgia}#warning{position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:8px 13px;border:1px solid #3d3932aa;background:#f7f5efc9;font:bold 12px Georgia;letter-spacing:1px;white-space:nowrap;pointer-events:none;box-shadow:1px 2px 0 #29272022}#hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:11px Georgia;letter-spacing:.6px;color:#686256;white-space:nowrap;text-shadow:0 1px #fff}#menu,#pauseLayer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 38%,#ffffffed,#f5f2e9f2);padding:24px}#menu:before,#pauseLayer:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(7deg,transparent 0 28px,#50493c06 29px,transparent 30px 54px)}#menu>* ,#pauseLayer>*{position:relative}h1{font-size:clamp(39px,10vw,57px);line-height:.91;letter-spacing:2.5px;margin:0 0 17px;text-shadow:1px 1px #aaa,2px 3px #7773}.subtitle{font-style:italic;color:#655f54;margin:0 0 34px;font-size:14px}.mainBtn{width:min(260px,78vw);padding:16px;margin:7px;font:bold 16px Georgia;letter-spacing:1.2px;border:1.5px solid #39362e;border-radius:2px;background:#f9f7f0;color:#292720;box-shadow:3px 4px 0 #35302430}.mainBtn:active{transform:translate(1px,2px);box-shadow:1px 2px #35302430}#menu small{max-width:265px;line-height:1.55;color:#696357;margin-top:16px;font-size:12px}#pauseLayer{gap:15px;background:#f7f5efeb}#pauseTitle{font-size:31px;letter-spacing:2px;font-weight:bold}#result{font-size:15px;line-height:2;color:#5b554a}#result b{color:#24221e}#resume,#restart{width:230px}.hidden{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud"><button class="glass" id="pauseBtn">Ⅱ</button><div id="score">0 м</div><div id="best">РЕКОРД 0 м</div><button class="glass" id="viewBtn">ВИД · СЗАДИ</button><div id="speedPanel"><span id="speedValue">5/10</span><input id="speed" type="range" min="1" max="10" value="5" aria-label="Скорость"></div><div id="warning" class="hidden"></div><div id="hint">КАСАНИЕ ЛИСТА · ПРЫЖОК</div></div><div id="menu"><h1>БЕГУЩИЙ<br>ЧЕЛОВЕК</h1><div class="subtitle">Бесконечный бег · графит и бумага</div><button class="mainBtn" id="start">НАЧАТЬ БЕГ</button><small>Коснись игровой области, чтобы прыгнуть.<br>Скорость регулируется ползунком справа.</small></div><div id="pauseLayer" class="hidden"><div id="pauseTitle">ПАУЗА</div><div id="result" class="hidden"></div><button class="mainBtn" id="resume">ПРОДОЛЖИТЬ</button><button class="mainBtn" id="restart">ЗАНОВО</button><button class="glass" id="menuBtn">В МЕНЮ</button></div><script src="game.bundle.js"></script></body></html>

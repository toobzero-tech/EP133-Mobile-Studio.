<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>Бегущий человек</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5ef;color:#25231f;font-family:Georgia,serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#pause{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;padding:9px 13px;pointer-events:auto;font-size:13px;letter-spacing:.5px}
#meters{position:absolute;top:58px;left:14px;font-size:14px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px #fff}
#view{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;padding:9px 11px;pointer-events:auto;font-size:12px;letter-spacing:.4px}
#speedbox{position:absolute;right:8px;top:22%;height:46%;width:46px;pointer-events:auto;display:flex;align-items:center;justify-content:center}
#speed{height:100%;width:30px;writing-mode:vertical-lr;direction:rtl;accent-color:#3a3832;touch-action:pan-y}
#speedlabel{position:absolute;right:0;top:-24px;font-size:12px;font-weight:bold}
button{font-family:Georgia,serif;border:1.5px solid #393730;background:rgba(255,255,255,.91);box-shadow:2px 3px 0 rgba(40,38,32,.24);color:#25231f;border-radius:2px}
button:active{transform:translate(1px,2px);box-shadow:0 1px 0 rgba(40,38,32,.24)}
#menu,#paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background-color:#f7f5ef;background-image:repeating-linear-gradient(7deg,transparent 0 27px,rgba(85,78,62,.025) 28px,transparent 29px 53px),radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.96),rgba(244,241,232,.95))}
#menu{padding:24px}
h1{font-size:clamp(34px,9vw,54px);line-height:.98;letter-spacing:2px;margin:0 0 18px;text-shadow:1px 1px 0 #aaa,2px 2px 0 rgba(80,75,65,.18)}
.sub{font-style:italic;margin:0 0 30px;color:#615d53}
.switch{width:min(240px,75vw);padding:15px;margin:8px;font-size:17px;font-weight:bold;letter-spacing:1px}
#menu small{max-width:260px;margin-top:18px;line-height:1.5;color:#615d53}
#paused{display:none;background:rgba(247,245,239,.86);font-size:30px;font-weight:bold;letter-spacing:2px;gap:18px}
#paused button{padding:13px 22px;font-size:16px}
#hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:12px Georgia;color:rgba(45,42,35,.58);white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<button id="pause">Ⅱ ПАУЗА</button>
<div id="meters">0 м</div>
<button id="view">ВИД: СЗАДИ</button>
<div id="speedbox"><span id="speedlabel">5/10</span><input id="speed" type="range" min="1" max="10" value="5" aria-label="Скорость бега"></div>
<div id="hint">ТАП ПО ЛИСТУ — ПРЫЖОК</div>
</div>
<div id="paused"><div id="pauseTitle">ПАУЗА</div><button id="resume">▶ ПРОДОЛЖИТЬ</button><button id="restartPause">↻ ЗАНОВО</button></div>
<div id="menu">
<h1>БЕГУЩИЙ<br>ЧЕЛОВЕК</h1>
<div class="sub">Бесконечный бег · рисунок карандашом</div>
<button class="switch" id="start">◉ НАЧАТЬ БЕГ</button>
<button class="switch" id="exit">⟲ В МЕНЮ</button>
<small>Тап по игровой области — прыжок.<br>Ползунок справа — скорость.</small>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const menu=document.getElementById('menu'),pauseLayer=document.getElementById('paused');
const metersEl=document.getElementById('meters'),speedEl=document.getElementById('speed'),speedLabel=document.getElementById('speedlabel');
let W=0,H=0,DPR=1,active=false,paused=false,dead=false,speed=5,clock=0,distance=0,jump=0,objects=[],spawnClock=0,lastFrame=0,paper=null,viewMode=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makePaper();draw();
}
function makePaper(){
  paper=document.createElement('canvas');paper.width=256;paper.height=256;
  const p=paper.getContext('2d');p.fillStyle='#f8f6f0';p.fillRect(0,0,256,256);
  let seed=9137;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=0;i<1100;i++){const a=.018+rnd()*.045;p.fillStyle='rgba(65,59,48,'+a+')';p.fillRect(rnd()*256,rnd()*256,.5+rnd()*1.2,.5+rnd()*1.2)}
  const g=p.createLinearGradient(0,0,256,256);g.addColorStop(0,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(120,110,90,.025)');p.fillStyle=g;p.fillRect(0,0,256,256);
}
function line(x1,y1,x2,y2,width=1,alpha=.45,color='#34312b'){
  ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=1;
}
function hatch(x1,y1,x2,y2,count=5,alpha=.18){
  for(let i=0;i<count;i++){const t=(i+.5)/count;line(x1+(x2-x1)*t-3,y1+(y2-y1)*t+2,x1+(x2-x1)*t+3,y1+(y2-y1)*t-2,.65,alpha)}
}
function drawTrack(){
  const horizon=H*.255,vanish=W*.5,edgeL=W*.035,edgeR=W*.965;
  // Slightly winding hand-drawn path, with perspective curvature.
  const bend=Math.sin(clock*.003)*W*.035;
  ctx.beginPath();ctx.moveTo(vanish-2,horizon);
  ctx.bezierCurveTo(vanish-bend*.35,H*.48,edgeL+bend,H*.72,edgeL,H);
  ctx.strokeStyle='rgba(48,45,38,.28)';ctx.lineWidth=1.25;ctx.stroke();
  ctx.beginPath();ctx.moveTo(vanish+2,horizon);
  ctx.bezierCurveTo(vanish+bend*.35,H*.48,edgeR+bend,H*.72,edgeR,H);
  ctx.stroke();
  line(vanish-5,horizon+5,edgeL+13,H,1,.12);line(vanish+5,horizon+5,edgeR-13,H,1,.12);
  for(let i=0;i<11;i++){
    const t=((i/11)+(clock*.012*speed/5))%1;
    const y=horizon+Math.pow(t,1.55)*(H-horizon);
    const half=4+Math.pow(t,1.2)*W*.45;
    line(vanish-half,y,vanish+half,y,.8,.10);
  }
  // graphite road-edge hatching, deliberately sparse for mobile performance
  for(let i=0;i<22;i++){
    const t=(i/22+clock*.006*speed/5)%1,y=horizon+Math.pow(t,1.55)*(H-horizon),spread=8+Math.pow(t,1.25)*W*.45;
    line(vanish-spread,y,vanish-spread-5,y+8,.7,.10);
    line(vanish+spread,y,vanish+spread+5,y+8,.7,.10);
  }
  // Fine, broken graphite scuffs on the paper road.
  for(let i=0;i<34;i++){
    const t=((i*.618+clock*.0018*speed)%1),y=horizon+Math.pow(t,1.7)*(H-horizon);
    const x=vanish+(Math.sin(i*17.31)*.78)*Math.pow(t,1.2)*W*.42;
    const len=2+Math.pow(t,1.4)*9;
    line(x,y,x+len,y-1.4,.55,.075);
  }
}
function limb(ax,ay,bx,by,r1,r2,shade=.1){
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  ctx.beginPath();ctx.moveTo(ax+nx*r1,ay+ny*r1);
  ctx.quadraticCurveTo((ax+bx)/2+nx*(r1+r2)*.62,(ay+by)/2+ny*(r1+r2)*.62,bx+nx*r2,by+ny*r2);
  ctx.lineTo(bx-nx*r2,by-ny*r2);
  ctx.quadraticCurveTo((ax+bx)/2-nx*(r1+r2)*.62,(ay+by)/2-ny*(r1+r2)*.62,ax-nx*r1,ay-ny*r1);
  ctx.closePath();ctx.fillStyle='rgba(55,52,45,'+shade+')';ctx.fill();ctx.strokeStyle='#302e29';ctx.lineWidth=1.45;ctx.stroke();
  for(let i=1;i<5;i++){const t=i/5;line(ax+(bx-ax)*t-2,ay+(by-ay)*t+2,bx-(bx-ax)*(1-t)+2,by-(by-ay)*(1-t)-2,.55,.22)}
}
function runner(px,py,zoom=1){
  const phase=clock*speed*.105,sw=Math.sin(phase),stride=Math.cos(phase);
  const lift=jump>0?Math.sin((1-jump)*Math.PI)*H*.145:0;
  ctx.save();ctx.translate(px,py-lift);ctx.scale(zoom,zoom);
  // soft graphite shadow
  ctx.fillStyle='rgba(35,32,27,'+(jump>0?.07:.15)+')';ctx.beginPath();ctx.ellipse(0,5+jump*15,22+jump*15,5,0,0,Math.PI*2);ctx.fill();
  // back leg and shoe
  limb(7,-19,15-stride*10,3,6.5,4.4,.17);limb(15-stride*10,3,22-stride*14,19,4.3,2.5,.12);
  limb(22-stride*14,19,30-stride*14,20,2.8,1.5,.22);
  // torso, shoulder and pelvis
  ctx.beginPath();ctx.moveTo(-8,-66);ctx.quadraticCurveTo(-17,-61,-18,-49);ctx.lineTo(-13,-28);ctx.quadraticCurveTo(0,-22,13,-28);ctx.lineTo(18,-49);ctx.quadraticCurveTo(17,-61,8,-66);ctx.quadraticCurveTo(0,-61,-8,-66);ctx.closePath();
  ctx.fillStyle='rgba(54,51,44,.16)';ctx.fill();ctx.strokeStyle='#292721';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-12,-30);ctx.quadraticCurveTo(0,-23,12,-30);ctx.lineTo(10,-17);ctx.quadraticCurveTo(0,-12,-10,-17);ctx.closePath();ctx.fillStyle='rgba(50,47,40,.2)';ctx.fill();ctx.stroke();
  // shoulder blades and fabric folds
  line(-10,-55,-2,-47,.8,.3);line(8,-56,2,-45,.8,.3);line(-8,-37,2,-32,.7,.25);line(3,-42,11,-36,.7,.2);
  for(let i=0;i<7;i++){const yy=-58+i*4;line(-7+(i%2),yy,6-(i%3),yy+2,.6,.18)}
  // arms counter-swing
  limb(-14,-57,-21+sw*7,-39,4.6,3.2,.12);limb(-21+sw*7,-39,-25+sw*10,-22,3.2,2.1,.10);
  limb(14,-57,21-sw*7,-40,4.6,3.2,.12);limb(21-sw*7,-40,25-sw*10,-23,3.2,2.1,.10);
  // front leg
  limb(-7,-19,-15+stride*10,2,6.8,4.6,.2);limb(-15+stride*10,2,-19+stride*14,18,4.5,2.5,.14);
  limb(-19+stride*14,18,-28+stride*14,20,2.8,1.5,.2);
  // neck and head
  ctx.fillStyle='rgba(75,68,58,.16)';ctx.strokeStyle='#292721';ctx.lineWidth=1.7;
  ctx.fillRect(-4,-69,8,9);ctx.strokeRect(-4,-69,8,9);
  ctx.beginPath();ctx.ellipse(0,-80,9.2,12,-.08,0,Math.PI*2);ctx.fill();ctx.stroke();
  line(-7,-83,-3,-87,.8,.3);line(2,-88,6,-84,.7,.25);line(-5,-75,4,-73,.65,.2);
  // Graphite contour accents, fabric seams and shoe tread.
  line(-17,-49,-13,-34,.65,.28);line(17,-49,13,-34,.65,.28);
  line(-7,-63,0,-60,.6,.24);line(7,-63,1,-59,.6,.24);
  line(-10,-27,-2,-24,.7,.3);line(2,-24,10,-27,.7,.3);
  for(let i=0;i<4;i++){
    line(-29+i*2,19,-27+i*2,21,.55,.34);
    line(25+i*1.5,19,27+i*1.5,21,.55,.34);
  }
  ctx.restore();
}
function obstacle(o){
  const s=.22+o.z*1.42,y=H*.705-o.z*H*.445,px=W*.5+o.lane*s;
  ctx.save();ctx.translate(px,y);ctx.scale(s,s);ctx.strokeStyle='#302e29';ctx.lineWidth=2.7;ctx.lineJoin='round';ctx.fillStyle='rgba(55,51,43,.07)';
  if(o.kind===0){
    // low fallen timber
    ctx.beginPath();ctx.moveTo(-54,-2);ctx.quadraticCurveTo(-42,-12,-25,-8);ctx.lineTo(45,-7);ctx.quadraticCurveTo(58,-4,52,5);ctx.lineTo(-48,8);ctx.closePath();ctx.fill();ctx.stroke();
    for(let i=0;i<8;i++)line(-38+i*11,-5,-41+i*11,-15,1.1,.38);
    hatch(-42,-2,43,2,10,.2);
  }else if(o.kind===1){
    // rough triangular barrier
    ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(-17,-51);ctx.quadraticCurveTo(0,-57,18,-49);ctx.lineTo(39,0);ctx.closePath();ctx.fill();ctx.stroke();
    line(-24,-17,25,-17,2,.42);line(-30,-4,31,-4,2,.42);hatch(-15,-42,14,-42,5,.25);
  }else{
    // low stone / broken block
    ctx.beginPath();ctx.moveTo(-34,-4);ctx.lineTo(-27,-25);ctx.lineTo(-10,-30);ctx.lineTo(2,-24);ctx.lineTo(23,-27);ctx.lineTo(35,-7);ctx.lineTo(28,3);ctx.lineTo(-27,4);ctx.closePath();ctx.fill();ctx.stroke();
    line(-17,-20,-3,-9,1,.3);line(10,-22,22,-10,1,.3);hatch(-22,-3,23,-2,7,.22);
  }
  ctx.restore();
}
function firstPerson(){
  const swing=Math.sin(clock*speed*.105),lift=jump>0?Math.sin((1-jump)*Math.PI):0;
  ctx.save();
  const arm=(side)=>{
    ctx.save();ctx.translate(W*.5+side*W*.31,H*.91-lift*H*.07);ctx.rotate(side*(.18+swing*.08));
    ctx.beginPath();ctx.moveTo(side*-7,-5);ctx.quadraticCurveTo(side*-24,-42,side*-17,-75);
    ctx.lineTo(side*-4,-82);ctx.quadraticCurveTo(side*3,-55,side*8,-34);ctx.lineTo(side*17,0);ctx.closePath();
    ctx.fillStyle='rgba(55,52,45,.19)';ctx.fill();ctx.strokeStyle='#302e29';ctx.lineWidth=2;ctx.stroke();
    for(let i=0;i<8;i++)line(side*(-13+i*2),-65+i*4,side*(-4+i*2),-61+i*4,.7,.25);
    ctx.beginPath();ctx.ellipse(0,-83,9,12,0,0,Math.PI*2);ctx.fillStyle='rgba(105,96,82,.18)';ctx.fill();ctx.stroke();
    for(let i=0;i<5;i++)line(side*(-6+i*3),-88,side*(-7+i*3),-80,.6,.3);
    ctx.restore();
  };
  arm(-1);arm(1);ctx.restore();
}
function draw(){
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  if(paper){ctx.fillStyle=ctx.createPattern(paper,'repeat');ctx.fillRect(0,0,W,H)}
  drawTrack();
  objects.slice().sort((a,b)=>a.z-b.z).forEach(obstacle);
  if(viewMode===2)firstPerson();
  else runner(W*.5,H*(viewMode===1?.82:.77),viewMode===1?1.34:.82);
}
function reset(){
  active=true;paused=false;dead=false;clock=0;distance=0;jump=0;objects=[];spawnClock=.65;
  metersEl.textContent='0 м';menu.style.display='none';pauseLayer.style.display='none';
  document.getElementById('pause').textContent='Ⅱ ПАУЗА';
}
function finish(){
  active=false;dead=true;paused=false;
  document.getElementById('pauseTitle').textContent='СТОЛКНОВЕНИЕ';
  document.getElementById('resume').style.display='none';
  document.getElementById('restartPause').textContent='↻ ЗАНОВО';
  pauseLayer.style.display='flex';
}
function frame(ts){
  if(!lastFrame)lastFrame=ts;
  const dt=clamp((ts-lastFrame)/16.667,0,2);lastFrame=ts;
  if(active&&!paused&&!dead){
    clock+=dt;distance+=speed*.012*dt;
    spawnClock-=dt;
    if(spawnClock<=0){
      const r=Math.random(),lane=r<.68?0:(r<.84?-0.34:0.34);
      objects.push({z:0,lane,kind:Math.floor(Math.random()*3),checked:false});
      spawnClock=clamp(1.65-speed*.085,.72,1.55)*(0.82+Math.random()*.38);
    }
    for(const o of objects){
      o.z+=speed*.00155*dt;
      // Collision is evaluated at the runner's actual contact line.
      if(!o.checked&&o.z>=.875){
        o.checked=true;
        const cleared=jump>.28;
        if(Math.abs(o.lane)<.05&&!cleared){finish();break}
      }
    }
    objects=objects.filter(o=>o.z<1.12);
    if(jump>0)jump=Math.max(0,jump-.021*dt);
    metersEl.textContent=Math.floor(distance)+' м';
  }
  draw();requestAnimationFrame(frame);
}
canvas.addEventListener('pointerdown',e=>{
  if(e.cancelable)e.preventDefault();
  if(active&&!paused&&!dead&&jump===0){jump=1}
},{passive:false});
speedEl.addEventListener('input',e=>{speed=Number(e.target.value);speedLabel.textContent=speed+'/10'});
document.getElementById('pause').addEventListener('click',()=>{
  if(!active||dead)return;
  paused=!paused;pauseLayer.style.display=paused?'flex':'none';
  document.getElementById('pauseTitle').textContent='ПАУЗА';
  document.getElementById('resume').style.display='block';
  document.getElementById('restartPause').textContent='↻ ЗАНОВО';
});
document.getElementById('resume').addEventListener('click',()=>{
  if(dead)return;paused=false;pauseLayer.style.display='none';
});
document.getElementById('restartPause').addEventListener('click',reset);
document.getElementById('start').addEventListener('click',reset);
document.getElementById('view').addEventListener('click',()=>{viewMode=(viewMode+1)%3;document.getElementById('view').textContent=['ВИД: СЗАДИ','ВИД: БЛИЖЕ','ВИД: ОТ 1 ЛИЦА'][viewMode];draw()});
document.getElementById('exit').addEventListener('click',()=>{
  active=false;paused=false;dead=false;objects=[];pauseLayer.style.display='none';menu.style.display='flex';
});
window.addEventListener('resize',resize,{passive:true});
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>

name: PRICE RADAR live Golova scan
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum pages per Russian city (up to 50 listings per page)
        required: false
        default: "2"
permissions:
  contents: read
  actions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: price-radar-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Russian cities
        run: |
          python PRICE_RADAR/tools/import_golova_market.py PRICE_RADAR/golova-cities.example.json --max-pages "${{ inputs.max_pages || '2' }}" --delay 1.1 -o golova_market_offers.json
          python -c "import json; x=json.load(open('golova_market_offers.json', encoding='utf-8')); print('VALID_RU_RUB_SALE_RECORDS:', len(x)); assert all(z['country']=='RU' and z['currency']=='RUB' and z['raw']['raw']['type']=='sale' for z in x)"
      - name: Upload live offers
        uses: actions/upload-artifact@v4
        with:
          name: PRICE_RADAR_Golova_Live_Offers
          path: golova_market_offers.json
          if-no-files-found: error
          retention-days: 7

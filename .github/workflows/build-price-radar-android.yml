name: Build PRICE RADAR Android APK
on:
  push:
    paths:
      - 'price-radar-android/**'
      - '.github/workflows/build-price-radar-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: price-radar-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PRICE-RADAR-Android-APK
          path: price-radar-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package source archive
        run: zip -r PRICE_RADAR_ANDROID_SOURCE_v1.2.0.zip price-radar-android -x "*/build/*" "*/.gradle/*"
      - uses: actions/upload-artifact@v4
        with:
          name: PRICE-RADAR-Android-Source
          path: PRICE_RADAR_ANDROID_SOURCE_v1.2.0.zip
          if-no-files-found: error

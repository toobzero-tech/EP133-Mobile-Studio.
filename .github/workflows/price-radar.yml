name: Build PRICE RADAR Avito MVP
on:
  push:
    branches:
      - price-radar-mvp
    paths:
      - 'PRICE_RADAR/**'
      - '.github/workflows/price-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: python PRICE_RADAR/tools/check_frontend.py
      - name: Prepare Avito-only ZIP
        run: |
          test -f PRICE_RADAR/index.html
          test -f PRICE_RADAR/backend/app.py
          mkdir -p dist/backend dist/tools
          cp PRICE_RADAR/index.html dist/
          cp -R PRICE_RADAR/backend/. dist/backend/
          cp PRICE_RADAR/DEPLOY.md PRICE_RADAR/CONTROL_POINTS.md dist/
          cp PRICE_RADAR/tools/check_frontend.py dist/tools/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          cd dist
          zip -r ../PRICE_RADAR_AVITO_MVP.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRICE_RADAR_AVITO_MVP
          path: PRICE_RADAR_AVITO_MVP.zip
          if-no-files-found: error
          retention-days: 30

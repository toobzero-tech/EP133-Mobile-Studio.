name: БЕСКОНЕЧНОСТЬ ∞ — проверка и сборка Windows
on:
  push:
    paths:
      - "windows-koii/**"
      - ".github/workflows/build-koii-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[BUILD_INFINITY]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64 xz-utils
      - name: Restore reviewed source
        run: |
          cat windows-koii/source.tar.xz.b64.part* > /tmp/infinity-source.tar.xz.b64
          base64 -d /tmp/infinity-source.tar.xz.b64 > /tmp/infinity-source.tar.xz
          mkdir -p /tmp/koii-src
          tar -xJf /tmp/infinity-source.tar.xz -C /tmp/koii-src
          SRC=/tmp/koii-src/EP133_KOII_Windows_0.5.0
          test -f "$SRC/CMakeLists.txt"
      - name: Validate reviewed source
        run: python3 windows-koii/apply_infinity_patch.py
      - name: Publish source review
        uses: actions/upload-artifact@v4
        with:
          name: infinity-windows-source-review-0.9.0
          path: |
            /tmp/koii-src/EP133_KOII_Windows_0.5.0/CMakeLists.txt
            /tmp/koii-src/EP133_KOII_Windows_0.5.0/README_RU.md
            /tmp/koii-src/EP133_KOII_Windows_0.5.0/src/**
            /tmp/koii-src/EP133_KOII_Windows_0.5.0/tests/**
          if-no-files-found: error
          retention-days: 7
      - name: Native strict tests with sanitizers
        run: |
          cmake -S /tmp/koii-src/EP133_KOII_Windows_0.5.0 -B /tmp/infinity-native -G Ninja
          cmake --build /tmp/infinity-native --verbose
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir /tmp/infinity-native --output-on-failure
      - name: Cross-compile Windows application
        run: |
          cmake -S /tmp/koii-src/EP133_KOII_Windows_0.5.0 -B /tmp/infinity-win -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_CXX_FLAGS="-pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -pthread -municode" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/infinity-win --verbose
          test -f /tmp/infinity-win/Infinity.exe
      - name: Package Windows EXE
        run: |
          mkdir -p dist
          cp /tmp/infinity-win/Infinity.exe dist/Бесконечность.exe
          cp /tmp/koii-src/EP133_KOII_Windows_0.5.0/README_RU.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Бесконечность-∞-Windows-0.9.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14

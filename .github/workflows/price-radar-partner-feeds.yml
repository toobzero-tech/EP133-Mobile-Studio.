name: PRICE RADAR authorized partner feeds
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRICE RADAR branch
        uses: actions/checkout@v4
        with:
          ref: price-radar-mvp
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect authorized Russian feeds
        run: python PRICE_RADAR/partner_feed_scan.py
      - name: Upload normalized offers
        uses: actions/upload-artifact@v4
        with:
          name: PRICE_RADAR_Russia_Partner_Feeds
          path: PRICE_RADAR/partner_feed_offers.json
          if-no-files-found: error
          retention-days: 14

name: PRICE RADAR daily Russia scan

on:
  push:
    paths:
      - ".github/workflows/price-radar-daily-scan.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum pages per Russian city (up to 50 listings per page)
        required: false
        default: "2"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PRICE RADAR
        uses: actions/checkout@v4
        with:
          ref: price-radar-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan configured Russian cities on Golova.Market
        run: |
          python PRICE_RADAR/tools/import_golova_market.py PRICE_RADAR/golova-cities.example.json --max-pages "${{ inputs.max_pages || '2' }}" --delay 1.1 -o PRICE_RADAR_Golova_Russia_Live.json
      - name: Prepare partner feed configurations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("PRICE_RADAR/partner-feeds.json").read_text(encoding="utf-8"))
          rss_yml = {"feeds": cfg.get("rss_atom_feeds", []) + cfg.get("yml_feeds", [])}
          json_feeds = {"feeds": cfg.get("json_feeds", [])}
          Path("PRICE_RADAR_RSS_YML_Config.json").write_text(json.dumps(rss_yml, ensure_ascii=False), encoding="utf-8")
          Path("PRICE_RADAR_JSON_Config.json").write_text(json.dumps(json_feeds, ensure_ascii=False), encoding="utf-8")
          print("RSS_ATOM_YML_CONFIGURED:", sum(1 for x in rss_yml["feeds"] if x.get("enabled") and x.get("country_confirmed") is True))
          print("JSON_CONFIGURED:", sum(1 for x in json_feeds["feeds"] if x.get("enabled") and x.get("country_confirmed") is True))
          PY
      - name: Import authorized RSS, Atom and YML partner feeds
        run: |
          python PRICE_RADAR/tools/import_feeds.py PRICE_RADAR_RSS_YML_Config.json --delay 2 -o PRICE_RADAR_RSS_YML_Live.json
      - name: Import authorized JSON partner feeds
        run: |
          python PRICE_RADAR/tools/import_json_feeds.py PRICE_RADAR_JSON_Config.json --delay 2 -o PRICE_RADAR_JSON_Live.json
      - name: Merge and validate Russian ruble offers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              "PRICE_RADAR_Golova_Russia_Live.json",
              "PRICE_RADAR_RSS_YML_Live.json",
              "PRICE_RADAR_JSON_Live.json",
          ]
          merged = {}
          counts = {}
          for name in files:
              rows = json.loads(Path(name).read_text(encoding="utf-8"))
              if not isinstance(rows, list):
                  raise SystemExit(f"Invalid JSON array: {name}")
              counts[name] = len(rows)
              for row in rows:
                  if row.get("country") != "RU" or row.get("currency") != "RUB":
                      continue
                  if not row.get("title") or not row.get("url") or float(row.get("price") or 0) <= 0:
                      continue
                  merged.setdefault(row.get("dedupe_key") or row.get("url"), row)
          result = list(merged.values())
          Path("PRICE_RADAR_Russia_All_Feeds.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          partner_cfg = json.loads(Path("PRICE_RADAR/partner-feeds.json").read_text(encoding="utf-8"))
          configured = {
              "rss_atom_yml": sum(1 for x in partner_cfg.get("rss_atom_feeds", []) + partner_cfg.get("yml_feeds", []) if x.get("enabled") and x.get("country_confirmed") is True),
              "json": sum(1 for x in partner_cfg.get("json_feeds", []) if x.get("enabled") and x.get("country_confirmed") is True),
          }
          report = {
              "generated_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "total_valid_ru_rub_active_offers": len(result),
              "source_counts": counts,
              "partner_feeds_configured": configured,
              "completed_sales_included": False,
              "note": "Это активные объявления, не подтверждённые завершённые продажи. Для оценки перепродажи нужна отдельная история сделок."
          }
          Path("PRICE_RADAR_scan_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("PRICE_RADAR_IMPORT_README.txt").write_text(
              "PRICE RADAR: импорт ежедневной выгрузки\n\n"
              "1. Распакуйте этот артефакт GitHub Actions.\n"
              "2. В приложении нажмите «Импорт объявлений JSON».\n"
              "3. Выберите PRICE_RADAR_Russia_All_Feeds.json.\n\n"
              "Файл содержит только активные объявления RU/RUB с названием, ценой и ссылкой. "
              "Он не содержит подтверждённых завершённых продаж и сам по себе не доказывает цену перепродажи. "
              "В приложении цена рынка останется «Нет оценки», пока не загружена история завершённых продаж.\n",
              encoding="utf-8"
          )
          print("SOURCE_COUNTS:", json.dumps(counts, ensure_ascii=False))
          print("PARTNER_FEEDS_CONFIGURED:", json.dumps(configured, ensure_ascii=False))
          print("VALID_RU_RUB_ACTIVE_OFFERS:", len(result))
          print("SOURCES_WITH_DATA:", sum(1 for count in counts.values() if count))
          PY
      - name: Publish latest feed for PRICE RADAR Android
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'price-radar-data/latest.json';
            const content = fs.readFileSync('PRICE_RADAR_Russia_All_Feeds.json').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: 'Publish latest PRICE RADAR Russia feed',
              content, ...(sha ? {sha} : {})
            });
      - name: Upload Russia-wide source files
        uses: actions/upload-artifact@v4
        with:
          name: PRICE_RADAR_Russia_Live_Feeds
          path: |
            PRICE_RADAR_Russia_All_Feeds.json
            PRICE_RADAR_Golova_Russia_Live.json
            PRICE_RADAR_RSS_YML_Live.json
            PRICE_RADAR_JSON_Live.json
            PRICE_RADAR_scan_report.json
            PRICE_RADAR_IMPORT_README.txt
          if-no-files-found: error
          retention-days: 14

name: Build Running Man 3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RunningMan/**'
      - '.github/workflows/build-running-man.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare 3D engine and licensed character
        run: |
          ASSETS="$GITHUB_WORKSPACE/RunningMan/app/src/main/assets"
          TOOLING="/tmp/runningman-tooling"
          mkdir -p "$TOOLING"
          npm install --prefix "$TOOLING" --no-save three esbuild
          "$TOOLING/node_modules/.bin/esbuild" "$ASSETS/game3d.js" --bundle --format=iife --global-name=RunningMan3D --outfile="$ASSETS/game3d.bundle.js"
          rm -rf "$ASSETS/node_modules" "$ASSETS/package.json" "$ASSETS/package-lock.json"
          cd "$ASSETS"
          curl -fL --retry 3 --retry-delay 2 -A "RunningMan-Game-Build/1.0" "https://www.innerscene.com/api/library/run-maya-3d-person-animated-eebf24b9/download" -o runner.glb
          test "$(stat -c%s runner.glb)" -gt 1000000
          file runner.glb
          ls -lh game3d.bundle.js runner.glb
      - name: Accept SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate 3D game source
        run: |
          node --check --input-type=module < RunningMan/app/src/main/assets/game3d.js
          npx --yes eslint@8 --no-eslintrc --env browser,es2022 --parser-options '{"sourceType":"module","ecmaVersion":"latest"}' --rule 'no-undef:error' RunningMan/app/src/main/assets/game3d.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("RunningMan/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert scripts, "Inline startup script missing"
          Path("/tmp/running-man-start.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/running-man-start.js
          test -s RunningMan/app/src/main/assets/game3d.bundle.js
          test -s RunningMan/app/src/main/assets/runner.glb
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p RunningMan assembleDebug
      - name: Verify APK and bundled 3D assets
        run: |
          APK=RunningMan/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/game3d.bundle.js'
          unzip -l "$APK" | grep -q 'assets/runner.glb'
          if unzip -l "$APK" | grep -q 'assets/node_modules/'; then
            echo "Unexpected build tooling leaked into APK assets"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.toobzero.runningman'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'28'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunningMan-3D-APK
          path: RunningMan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build Running Man APK
on:
  push:
    branches: [running-man-prototype]
    paths: ['RunningMan/**', '.github/workflows/build-running-man.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle Three.js engine
        working-directory: RunningMan
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate bundled engine
        run: |
          node --check RunningMan/app/src/main/assets/game.bundle.js
          test -s RunningMan/app/src/main/assets/game.bundle.js
          grep -q 'game.bundle.js' RunningMan/app/src/main/assets/index.html
      - name: Build APK
        working-directory: RunningMan
        run: gradle --no-daemon assembleDebug
      - name: Package source
        run: zip -r RunningManAndroid_Source.zip RunningMan -x 'RunningMan/node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: RunningMan-ThreeJS-APK-and-Source
          path: |
            RunningMan/app/build/outputs/apk/debug/app-debug.apk
            RunningManAndroid_Source.zip
          if-no-files-found: error
          retention-days: 14

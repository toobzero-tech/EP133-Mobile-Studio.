name: Build Running Man APK
on:
  push:
    branches: [running-man-prototype]
    paths: ['RunningMan/**', '.github/workflows/build-running-man.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate game JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('RunningMan/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline game script, found {len(scripts)}')
          Path('/tmp/running-man.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/running-man.js
      - name: Build debug APK
        working-directory: RunningMan
        run: gradle --no-daemon assembleDebug
      - name: Package source ZIP
        run: zip -r RunningManAndroid_Source.zip RunningMan
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: RunningMan-APK-and-Source
          path: |
            RunningMan/app/build/outputs/apk/debug/app-debug.apk
            RunningManAndroid_Source.zip
          if-no-files-found: error
          retention-days: 14

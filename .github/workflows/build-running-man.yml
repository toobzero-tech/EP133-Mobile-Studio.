name: Build Running Man APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RunningMan/**'
      - '.github/workflows/build-running-man.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p RunningMan assembleDebug
      - name: Verify APK
        run: |
          test -s RunningMan/app/build/outputs/apk/debug/app-debug.apk
          file RunningMan/app/build/outputs/apk/debug/app-debug.apk
          ls -lh RunningMan/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunningMan-APK
          path: RunningMan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

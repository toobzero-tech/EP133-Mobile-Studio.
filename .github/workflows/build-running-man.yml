name: Build Running Man APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RunningMan/**'
      - '.github/workflows/build-running-man.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p RunningMan assembleDebug
      - name: Verify APK
        run: |
          test -s RunningMan/app/build/outputs/apk/debug/app-debug.apk
          APK=RunningMan/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/index.html'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.toobzero.runningman'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'28'"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunningMan-APK
          path: RunningMan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

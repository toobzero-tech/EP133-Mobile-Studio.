name: Deploy Price Radar to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Price Radar HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("price-radar-mvp/PRICE_RADAR/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/price-radar-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          required = ["importLiveJSON", "importSalesJSON", "localStorage", "function render"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing required app features: " + ", ".join(missing))
          class Check(HTMLParser):
              def error(self, message):
                  raise ValueError(message)
          Check().feed(source)
          print("HTML parsed; inline scripts:", len(scripts), "; required features present")
          PY
          node --check /tmp/price-radar-inline.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site files
        run: |
          mkdir -p site
          cp price-radar-mvp/PRICE_RADAR/index.html site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

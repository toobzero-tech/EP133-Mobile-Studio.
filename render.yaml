services:
  - type: web
    name: price-radar-api
    runtime: python
    rootDir: PRICE_RADAR
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: APISH_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_DAILY_ANALYSIS_LIMIT
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
